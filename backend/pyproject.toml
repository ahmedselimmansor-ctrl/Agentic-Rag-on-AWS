[project]
name = "agentic-rag-backend"
version = "1.0.0"
description = "Agentic RAG backend — FastAPI + LangGraph + pgvector"
requires-python = ">=3.12"

dependencies = [
    # web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # database
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "psycopg2-binary>=2.9.10",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # agent + models
    "langgraph>=0.2.60",
    "langchain-core>=0.3.20",
    "openai>=1.60.0",
    "tiktoken>=0.8.0",

    # http
    "httpx>=0.27.2",

    # parsing
    "pypdf>=5.1.0",
    "python-docx>=1.1.2",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",

    # aws
    "boto3>=1.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.2",
    "ruff>=0.8.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "C4", "SIM"]
ignore = [
    "E501",  # line length is handled by the formatter
    "B008",  # FastAPI Depends() in argument defaults is the idiom
    "UP042", # str+Enum is deliberate: SQLAlchemy's Enum() binds these by value
]

[tool.ruff.lint.per-file-ignores]
"alembic/*" = ["I001"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
