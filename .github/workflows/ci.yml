name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend — lint, test, migrate
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: agentic_rag_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/agentic_rag_test
      # Placeholders: no test reaches a live provider.
      OPENAI_API_KEY: test-key
      DASHSCOPE_API_KEY: test-key
      WEB_SEARCH_PROVIDER: none

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        working-directory: backend
        run: ruff check app tests

      - name: Test
        working-directory: backend
        run: pytest -q

      - name: Migrations apply to a clean database
        working-directory: backend
        run: alembic upgrade head

      # A model change with no matching migration is the classic way a deploy
      # breaks in production but passes CI. Autogenerate must produce nothing.
      #
      # The new file is identified by diffing the directory listing, never by
      # mtime: if autogenerate fails and writes nothing, an mtime-based guess
      # selects a real committed migration and the cleanup step deletes it.
      - name: No missing migrations
        working-directory: backend
        run: |
          set -euo pipefail
          before=$(mktemp)
          ls alembic/versions/*.py | sort > "$before"

          # Armed BEFORE alembic runs. A post-write hook failure makes alembic
          # exit non-zero *after* it has already written the revision file, and
          # a stray revision becomes the new head — which breaks every later
          # migration command. Cleanup must not depend on reaching the end.
          cleanup() {
            ls alembic/versions/*.py 2>/dev/null | sort | comm -13 "$before" - | xargs -r rm -f
          }
          trap cleanup EXIT

          alembic revision --autogenerate -m "ci-drift-check"

          generated=$(ls alembic/versions/*.py | sort | comm -13 "$before" -)
          if [ -z "$generated" ]; then
            echo "::error::alembic autogenerate produced no revision file — the drift check could not run."
            exit 1
          fi

          if grep -qE '^\s+op\.(create|drop|add|alter|rename)' "$generated"; then
            echo "::error::Model changes have no migration. Generated diff:"
            cat "$generated"
            exit 1
          fi
          echo "No drift: models match migrations."

      - name: Migrations are reversible
        working-directory: backend
        run: alembic downgrade base

  frontend:
    name: Frontend — typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    name: Terraform — format and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        working-directory: infra/terraform
        run: terraform fmt -check -recursive -diff

      - name: Validate
        working-directory: infra/terraform
        # No backend and no credentials — validate only checks the config graph.
        run: |
          terraform init -backend=false
          terraform validate
